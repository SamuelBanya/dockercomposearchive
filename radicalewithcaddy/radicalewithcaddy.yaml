services:
  radicale:
    image: tomsquest/docker-radicale
    container_name: radicale
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/sam/radicale/data:/data
      - /home/sam/radicale/config:/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5232"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "8443:8443"
    volumes:
      - /home/sam/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/sam/caddy/data:/data
    depends_on:
      - radicale
    restart: unless-stopped