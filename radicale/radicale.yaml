services:
  radicale:
    image: tomsquest/docker-radicale
    container_name: radicale
    ports:
      - "8443:5232"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /home/sam/radicale/data:/data
      - /home/sam/radicale/config:/config
      - /home/sam/radicale/certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-k", "--fail", "https://localhost:5232"]
      interval: 30s
      retries: 3
    restart: unless-stopped
